name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'chore/**']

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-fund --no-audit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
